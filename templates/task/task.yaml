# TEMPLATE — a complete robotics task that scores green as shipped. Change it into yours
# one field at a time; `ale validate` after each change tells you if you broke it.

spec_type: core/v1

# The task's stable identity: a collection-unique slug (^[a-z0-9][a-z0-9_-]*$, preferably
# snake_case). Pick your own before anything else: it is the Task Name registered in the
# project's sheet, and once the task lands at tasks/<platform>/<name>/ the folder must carry
# the same name (the domain lint checks).
name: template_reach

# image/Dockerfile is the sole build context, and its final stage must derive directly
# from an official ALE base (this template's does). A prebuilt registry image works too:
# `image: {kind: container, ref: ghcr.io/...:tag}` with no image/Dockerfile.
image: {kind: container}

resources: {cpus: 2, memory_mb: 4096}
network: {mode: block}

# setup: staging the agent-visible material. agent: the agent's whole budget, including
# training. verify: the scoring run — closed_loop needs room for every episode plus probes.
timeouts: {setup: 120, agent: 3600, verify: 900}

# Where the agent leaves its work.
artifacts: [/home/user/submission]

# Grader knobs live in verify/grader_config.json, NOT here: `params` are rendered into
# instruction.md and checked strictly both ways, so a declared parameter the prompt does
# not mention is a lint error — and episode counts are the grader's business anyway.
#
# There is no admission bar in this file. `ale validate` runs the task twice: an untouched
# sandbox must produce an all-zero verdict, and the oracle, run in place of the agent, must
# score exactly 1.0 on every reward key. Either miss fails validation (`untouched_nonzero`,
# `oracle_not_full`). The tolerance that lets an honest oracle land on exactly 1.0 under
# fresh hidden seeds is `full_at` in verify/anchor.json, sized from the metric's measured
# seed-to-seed spread. See that file.

metadata:
  # platform: one of the benchmark's platform keys (tasks/platforms.json in this repository):
  #   arm | hand | quadruped | humanoid | uav | driving | underwater | space | soft |
  #   surgical | swarm | subsystems
  # It also names the tasks/<platform>/ folder the task lands in. A platform that is not on
  # the list needs a maintainer to add it to tasks/platforms.json first.
  # The metric and its direction live in verify/anchor.json (`metric`, `direction`): an
  # OUTCOME on a positive scale (success_rate, reward, SPL, ATE, collision_rate, or a cost
  # with direction lower), never a wall-clock time, throughput, FPS or frequency, which
  # measure the machine, not the method.
  platform: TODO
