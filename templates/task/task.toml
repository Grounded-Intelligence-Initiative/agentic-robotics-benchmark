# TEMPLATE — a complete robotics task that scores green as shipped. Change it into yours
# one field at a time; `ale validate` after each change tells you if you broke it.
#
# task.toml is strict: an unknown key fails `ale lint`, and a key left out takes the
# engine's default. Upstream's task-authoring spec annotates every key
# (vendor/ale/docs/specs/task-authoring.md, "task.toml"); this file sets the ones a
# robotics task here needs.

# Harbor's task.toml schema 1.4 with ALE's fields. Exactly this string.
schema_version = "1.4+ale.1"

# Where the agent leaves its work. A top-level key, so it sits above the first [table].
# Every path the instruction tells the agent to write to must be one of these or lie below
# one (an entry may also be a glob). The engine never creates an artifact path or fixes its
# ownership: the image creates this folder, owned by the agent (environment/Dockerfile).
artifacts = ["/home/user/submission"]

# The task's stable identity, "<org>/<slug>". The org is grounded-intelligence-initiative,
# the GitHub and Hugging Face organization that owns the benchmark, for every task here.
# The slug, the part after the "/", is yours: collection-unique, ^[a-z0-9][a-z0-9_-]*$,
# preferably snake_case. Pick it before anything else: it is the Task Name registered in
# the project's sheet, and once the task lands at tasks/<platform>/<slug>/ the folder must
# carry the same name (the domain lint checks). A task scaffolded with `ale new-task` gets
# "agentslastexam/<folder>": change the org.
[task]
name = "grounded-intelligence-initiative/template_reach"

# Free-form values with no runtime behavior; this repository reads one of them.
# platform: one of the benchmark's platform keys (tasks/platforms.json in this repository):
#   arm | hand | quadruped | humanoid | uav | driving | underwater | space | soft |
#   surgical | swarm | subsystems
# It also names the tasks/<platform>/ folder the task lands in. A platform that is not on
# the list needs a maintainer to add it to tasks/platforms.json first.
# The metric and its direction live in tests/anchor.json (`metric`, `direction`): an
# OUTCOME on a positive scale (success_rate, reward, SPL, ATE, collision_rate, or a cost
# with direction lower), never a wall-clock time, throughput, FPS or frequency, which
# measure the machine, not the method.
[metadata]
platform = "TODO"

# The agent's machine. environment/Dockerfile builds it, with environment/ less setup/ as
# the build context; its FROM names the ALE base at an exact version (lint rejects `latest`
# and an untagged FROM). A prebuilt image works too: `docker_image = "ghcr.io/...:tag"`
# here, and delete environment/Dockerfile (an image named directly wins over a build).
# cpus and memory_mb are the whole sandbox's allocation; `gpus` (a count, default 0) and
# `storage_mb` are there for a task that needs them.
[environment]
cpus = 2
memory_mb = 4096

# The agent's whole budget in seconds, training included. The oracle (solution/solve.sh)
# runs in its place under the same budget, account and network. With "no-network" the
# agent reaches only the engine's model gateway; "allowlist" adds the hosts in
# `allowed_hosts`; "public" needs a reason in [metadata].network_justification. `user`
# keeps its default, the base image's account `user` (home /home/user).
# Setup (environment/setup/setup.sh) has no field: the engine bounds it at a fixed 1800 s.
[agent]
timeout_sec = 3600
network_mode = "no-network"

# The scoring run (tests/test.sh) in seconds: closed_loop needs room for every episode plus
# probes. Verification is shared: once the agent is done, tests/ is staged into the same
# sandbox and runs there as root.
#
# Grader knobs live in tests/grader_config.json, never in this file: [metadata] has no
# runtime behavior, and episode counts are the grader's business anyway. Not
# tests/config.json either: the engine writes its own file under that name at verify time.
#
# There is no admission bar in this file. `ale validate` runs the task twice: an untouched
# sandbox must score reward 0.0, and the oracle, run in place of the agent, must score 1.0,
# both after the engine rounds `reward` to two decimals. Either miss fails validation
# (`untouched_nonzero`, `oracle_not_full`). The tolerance that lets an honest oracle land on
# 1.0 under fresh hidden seeds is `full_at` in tests/anchor.json, sized from the metric's
# measured seed-to-seed spread. See that file.
[verifier]
timeout_sec = 900
