# tensegrity_collapsed_warehouse_void_search (behavior stage: an off-board operating program searches the void under
# a collapsed slab of a warehouse with a small three-strut, cable-driven tensegrity rolling robot; tests/verify.py).
#
# A small rolling robot made of three struts joined by cables (the robot is the authors' published whole-strut mesh,
# three times, decimated for the camera; six motors shorten or lengthen six cables; MuJoCo on CPU, single-threaded
# physics, the classic renderer on OSMesa) is set down on a pad at the front of a collapsed warehouse bay. A fixed
# overhead RGB-D search camera on a mast sees the bay from above; the robot carries no camera. The agent writes the
# operator's OFF-BOARD program (operate.py, solve(station)): it reads the camera's raw RGB-D frames and the robot's
# telemetry, estimates the robot's pose itself, commands the robot's rolling primitives and cable targets, works out
# which openings lead into the void under the fallen slab, dead-reckons through the part the camera cannot see, dwells
# 20 s at each of three search points to take an air reading (reports), and brings the robot back to the pad.
# Score per site S = F x (0.05 c1 + 0.15 c2 + 0.80 c3) (c: after a valid dwell, full credit within 0.20 m of the
# point, linear to none at 0.40 m; F = 1.0 back within 0.60 m of the pad, else 0.85; tests/voidscore/acceptance.yaml,
# the single source of every threshold); void_search_score = the contract gate x the
# mean of S over ten hidden sites, stored as site packages in tests/hidden/sites/ and selected by the pre-registered
# rule of tests/hidden/selection.json among sites the privileged reference completes. The oracle submits a two-line
# program with a 256-bit token: the reference program inside the cell gets the true pose and the true layout. The
# agent gets what an operator of a rescue team would have: the robot's handbook and the station's API (datasheet
# level), the site briefing, the camera's datasheet, the calibration site's pages, the client library, and a practice
# ground (a black-box service under its own account: the calibration site and three practice sites, 30 episodes, a
# debrief after each); the simulator's code, the site generator and every ground truth of a scored site stay out of
# its reach.
#
# setup (no field: the engine bounds it at a fixed 1800 s): the givens in the agent home and the practice ground.
# [agent] timeout_sec: 4 h.
# [verifier] timeout_sec, from numbers measured in containers of the task image with the verifier's 8 CPUs and 16 GB:
# version 1.1's image (2be78b3799c7, built from environment/ of these bytes), 2026-11-19 16:17-16:39 UTC, host load
# 19-56 of 48 cores, and version 1.0's (the same cell code with its own practice sites), 2026-11-17 21:18-21:31 UTC,
# host load 42-91 (the maintainers' bench_operate.py through ~/training/run_mission.py on practice sites: one episode
# alone, then two at once; every call timed from the program's side of the wire; recorded in the maintainers'
# costs.json files; every input below is the largest measured in either image): the fixed steps (the import check at
# most 120 s, the no-network self-test at most 60 s, the desktop settle at most 60 s, the lockdown, the copy and check
# of the givens and the acceptance file: 260 s), then the ten hidden sites, each at the bounds of the configuration
# (tests/grader_config.json limits and hidden/limits.json: 1800 s simulated, 600 frames, 600 s program time): the
# cell's build from its stored site package and its first frame (10 s), the program within its 600 s program-time cap,
# which does not count the cell's simulation and rendering (1800 s simulated at 0.1922 s of wall clock per simulated
# second, the slowest whole-episode pace of the bench with a primitive running and the wire included: 346 s) and every
# frame of the budget (600 x 0.3552 s, the p95 cost of get_frame, encoding and wire included: 213 s), the wire's 60 s
# grace after the episode is over and 30 s of end, scoring and clean-up: 1259 s a site; eleven episodes (verify.py
# runs at most one episode again after a cell failure; a second one is a task error: MAX_RERUNS_PER_VERIFY) and the
# fixed steps: 14109 s; 19100 s is 1.35 times that (and is above the 16200 s floor for ten serial worst-case episodes
# and one re-run).
# The oracle's episodes run the reference program inside one privileged call (its cap 3600 s each); the freeze's two
# oracle runs of tests/verify.py took 3375 and 3398 s of wall clock for the ten on the development host (two at once).

schema_version = "1.4+ale.1"
# Where the agent leaves its work (operate.py and its helper modules).
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/tensegrity_collapsed_warehouse_void_search"

[metadata]
# One of the benchmark's platform keys (tasks/platforms.json); the folder lives at tasks/soft/<name>/. The metric
# (void_search_score, higher) lives in tests/anchor.json.
platform = "soft"
tags = ["search-and-rescue", "collapsed-building", "void-search", "tensegrity", "soft-robot", "rolling-robot",
        "cable-driven", "motion-primitives", "rgbd", "overhead-camera", "pose-estimation", "dead-reckoning",
        "mujoco", "code-as-policy", "practice-ground", "hidden-site", "oracle-token"]

[environment]
cpus = 8
memory_mb = 16384

[agent]
timeout_sec = 14400
network_mode = "no-network"

[verifier]
timeout_sec = 19100
# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifact (the submission) restored into it, so nothing else the agent left (a file,
# a process, a program planted on root's PATH) reaches it. environment/setup/setup.sh does not run there: tests/test.sh
# builds the grader's root-owned copy of the givens itself. The agent's program runs during verify, so the verifier
# gets the agent's resources (CPU rendering: no GPU).
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 16384
gpus = 0
