# cross_embodiment_adaptation (quadruped): a small scout maps an unmapped hall in its own frame; a large, heavy carrier
# that sees only the floor under its base must find itself in that map and deliver, on hidden sites, with a program
# the agent writes.
#
# Maintainers' first round (2026-11-12, PR #37 review): the graded record moved from the agent sandbox's live service
# to a separate verifier that runs the agent's mission program once on each of 8 fixed hidden sites (tests/hidden/,
# selected by the pre-registered rule in tests/review/selection.md with the frozen privileged oracle); the agent's
# sandbox keeps a commissioning service on random development sites (no truth, no score, no debrief).
#
# Second round (2026-11-16): no global coordinates. The first round's world-fixed top view let the scout's map serve
# the carrier as it stood, and the frontier model delivered on 8 of 8 sites. Now each body carries its own camera,
# centred on the body and turning with it: the scout a pinhole on a mast (walls and crates lean away from the centre
# and hide the floor behind them), the carrier a floor camera under its base (about 0.6 m of floor, the span not
# reported, another exposure, noise) that never shows an obstacle. The leg odometer over-reads when a foot slips, and
# a slip turns the body. The carrier is set down within 0.8 m of the scout's start at a heading of its own. So the
# scout has to build its map from registered frames, and the carrier has to find its pose in that map from the floor
# and keep it while it drives. On 200 development seeds a perfectly controlled carrier arrives 200 times with the
# truth, once without the scout's map, 17 times when it takes its start to be the dock point, 4 times when it takes
# its heading to be the scout's, twice on dead reckoning with the odometer (tests/review/ablation.json). The
# reference program from the robots' own observations (solution/reference, no token) arrives on 24/24 development
# sites (tests/review/reference_dev.json); the privileged oracle on 8/8 hidden sites (tests/anchor.json).
#
# [agent] timeout_sec: 2 h to write, commission and leave the mission program. [verifier] timeout_sec: 8 missions,
# each at most 1800 s of wall clock (program time <= 600 s plus the service's rendering, 0.06-0.16 s a frame here for
# at most 1000 requests) plus the service start and clean-up (about 20 s); a mission the service itself fails runs
# once more. The oracle's eight missions take about 3 min here, the reference's about 25 min.
schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/cross_embodiment_adaptation"

[metadata]
platform = "quadruped"

[environment]
cpus = 2
memory_mb = 4096
gpus = 0

# The robot service's MCP bridge, which setup copies from environment/setup/payload/ into the root-owned
# /opt/visual_robotics/client. Nothing in it depends on the working directory: Python resolves its one local import
# (client.py) from the script's own folder, and the bridge uses only stdin, stdout and the service socket.
[[environment.mcp_servers]]
name = "robot"
transport = "stdio"
command = "/opt/venv/bin/python3"
args = ["/opt/visual_robotics/client/mcp_stdio.py"]

[agent]
timeout_sec = 7200
network_mode = "no-network"

[verifier]
timeout_sec = 16200
environment_mode = "separate"

[verifier.environment]
cpus = 2
memory_mb = 4096
gpus = 0
