# PR37 v4: map with the scout, transfer to a long oriented carrier, settle into a dock.
# Native MuJoCo force-driven stabilized planar bases; no articulated gait claim.
# Body-mounted perspective cameras; no globally calibrated top view or pose fields.
# Latest round-2 head 9d8cc14 seeds/candidates retained without outcome-based reselection.
# PRIVILEGED direct-World reference diagnostics: 8/8 hidden and 20/20 development.
# These are not the separate-verifier anchor or frontier difficulty evidence.
# Round-2 source/reference/evidence are byte-preserved under tests/review/legacy_round2/.
# Pre-integration candidate receipts are historical under tests/review/legacy_candidate_v3/.
# Session/resource/network/verifier settings below match maintainer head 9d8cc14.
schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/cross_embodiment_adaptation"

[metadata]
platform = "quadruped"

[environment]
cpus = 2
memory_mb = 4096
gpus = 0

# The robot service's MCP bridge, which setup copies from environment/setup/payload/ into the root-owned
# /opt/visual_robotics/client. Nothing in it depends on the working directory: Python resolves its one local import
# (client.py) from the script's own folder, and the bridge uses only stdin, stdout and the service socket.
[[environment.mcp_servers]]
name = "robot"
transport = "stdio"
command = "/opt/venv/bin/python3"
args = ["/opt/visual_robotics/client/mcp_stdio.py"]

[agent]
timeout_sec = 7200
network_mode = "no-network"

[verifier]
timeout_sec = 16200
environment_mode = "separate"

[verifier.environment]
cpus = 2
memory_mb = 4096
gpus = 0
