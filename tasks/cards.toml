# The task cards: how the website and other displays name and file each task on main.
#
# One table per task, named by the task's slug. Maintainers keep this file; a contributor may
# suggest a title in the pull request. It sits outside every task folder, so a card is no part of
# a task's identity: editing it changes no spec_hash and no content_digest.
#
#   title      a readable name, sentence case, at most 48 characters, no closing period
#   summary    one sentence, at most 200 characters
#   platforms  the platforms the task involves (keys of tasks/platforms.json); the first is its folder's
#   stages     the stages of the workflow it covers, in workflow order, or ["end-to-end"] alone
#
# scripts/task_cards.py checks every card (CI); docs/task-cards.md has the rules.

[arm_hidden_mechanism_box]
title = "Open puzzle boxes with hidden interlocks"
summary = "A Franka Panda must open four wooden puzzle boxes whose lids are held by hidden interlocks, learning each mechanism through a limited number of lab trials."
platforms = ["arm"]
stages = ["behavior"]

