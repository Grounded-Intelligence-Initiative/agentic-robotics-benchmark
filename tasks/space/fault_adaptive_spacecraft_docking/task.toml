schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/fault_adaptive_spacecraft_docking"

[metadata]
platform = "space"

[environment]
cpus = 2
memory_mb = 4096

[agent]
timeout_sec = 10800
network_mode = "no-network"

# Separate verification: after the agent phase the solver sandbox is released and a fresh
# verifier sandbox starts from the task image, with only the declared artifact
# (/home/user/submission) restored at the same path. test.sh runs as root there; setup.sh
# does NOT run, so the agent's home (the dev copy of the simulator, the practice grader) and
# anything the agent left outside the submission are absent. This closes the shared-mode hole
# where a file the agent planted on root's PATH would run as root at verify. The grader is
# self-contained from tests/ (env.py, the fixed hidden set in hidden/, anchor.json,
# grader_config.json, nonet_exec.py, robotics_grader/) plus the image's /opt/venv; it re-owns
# the restored submission to the agent account and drives the live controller over the kit
# Solver, started through nonet_exec.py: the agent account, a fixed environment and no
# socket but AF_UNIX (a self-test before episode 0 checks that the seccomp filter holds;
# where it cannot be installed, the verify ends as a task error and grades nothing, since a
# controller with the network could fetch the public set). Every
# submission meets the same 48 hidden episodes. The privileged reference verifies in about
# 30 s on 2 CPUs (about 14,000 requests); a controller that spends the whole average reply
# budget of about 0.09 s per request on 48 x 400 steps needs most of the 1800 s.
[verifier]
timeout_sec = 1800
environment_mode = "separate"

# The fresh verifier sandbox's resources, matched to the agent environment: the grader runs
# 48 short episodes over one numpy controller, CPU-bound on small matrices, no GPU.
[verifier.environment]
cpus = 2
memory_mb = 4096
gpus = 0
