schema_version = "1.4+ale.1"

# Where the agent leaves its work: a calibration program (run.sh and whatever it needs).
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/multisensor_rig_calibration_from_logs"

[metadata]
platform = "subsystems"

# 8 CPUs, no GPU: the agent develops and tests its calibration program on the three practice rigs.
[environment]
cpus = 8
memory_mb = 16384

[agent]
timeout_sec = 7200
network_mode = "no-network"

# Verify: generate 6 hidden rigs (about 3 min on 6 CPUs), run the submission on all 6 at once with
# 900 s each, then measure (under a minute). The reference calibrator needs about 4 min per rig when
# six run together.
[verifier]
timeout_sec = 2700
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 32768
gpus = 0
