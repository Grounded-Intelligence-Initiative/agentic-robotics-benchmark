# furniture_assembly_from_drawings (Physical Execution, humanoid; built 2026-10-30 by Yuanfang Peng), ONLINE VARIANT
# (experiment branch, 2026-11-17: never merged into main).
#
# A furniture-assembly service on site: two Unitree G1 humanoids (29 DoF, Dex3-1 hands) must build the B930 flat-pack
# bookcase (two side panels, top, bottom, fixed shelf and a hardboard back, joined by dowels) exactly as its drawings
# show and stand it where the drawings' floor plan puts it. The parts lie as unpacked, in different places and
# orientations every episode; the manufacturer's drawing set (parts list, part drawings, wordless assembly steps, floor
# plan) is the only description of the furniture, and two-person steps need both robots. The sensing is camera-only
# (two ceiling RGB-D cameras and a head RGB-D camera per robot, noisy localisation, joint encoders and tactile load; no
# part poses, no part identities, no joint states on the wire). Online variant: the agent plays ONE hidden graded
# episode itself during its session (drawn once from the offline grader's 63-bit episode seeds; the same for every
# model) through the graded episode's service (environment/setup/online/graded_server.py: the offline grader's own
# cell under the offline per-episode rules, run as the lab account, reachable on a Unix socket only), which writes the
# episode's record to /var/lib/arb-online, a directory the agent can neither read nor write. The separate verifier
# scores that record: assembly_score = the bookcase's credited weight / 9 when the episode ends (the six dowel joints,
# the back panel, the placement), 0 after a safety violation. A practice lab serves practice episodes of the same cell
# (never privileged, budget-limited) on another Unix socket. The oracle plays the graded episode with the privileged
# reference assembler (its start carries the oracle token).

schema_version = "1.4+ale.1"
# The graded episode's record directory (written by the graded episode's service as the lab account; restored
# root-owned in the separate verifier, which scores it), and the agent's submission folder (collected, not read).
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/furniture_assembly_from_drawings"

[metadata]
# One of the benchmark's platform keys (tasks/platforms.json); the folder lives at tasks/humanoid/<name>/. The metric
# (assembly_score, higher) lives in tests/anchor.json.
platform = "humanoid"
tags = ["assembly", "furniture", "flat-pack", "assembly-drawings", "humanoid", "unitree-g1", "multi-robot", "bimanual",
        "mobile-manipulation", "mujoco", "code-as-policy", "camera-only", "rgbd", "practice-lab", "hidden-seed"]

[environment]
cpus = 8
memory_mb = 16384

# setup (no field: the engine bounds it at a fixed 1800 s): the agent's givens, the practice lab (its server builds one
# cell as a self-test before it listens) and the graded episode's service (its worker builds the graded episode's cell
# before it serves); seconds. [agent] timeout_sec = prep_s + graded_s (environment/setup/online/graded_config.json):
# the graded episode must be started within prep_s = 4 h (the agent budget on main, practice included) of the
# service's start, and then runs for at most graded_s = 3 h of wall clock (the contract's default: the cell's own work
# for a whole episode at its bounds, 1500 s simulated and 900 frames, is about 25 min here; the oracle's episode takes
# about 5 min). [verifier] timeout_sec: verify.py only reads the record.
[agent]
timeout_sec = 25200
network_mode = "no-network"

# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifacts in it (restored root-owned): the graded episode's record directory, which
# verify.py reads, and the submission, which nothing reads. environment/setup/setup.sh does not run there and no
# program runs: two CPUs and 4 GB are plenty.
[verifier]
timeout_sec = 600
environment_mode = "separate"

[verifier.environment]
cpus = 2
memory_mb = 4096
gpus = 0
