# house_cleaning_with_tools (Physical Execution, humanoid; built 2026-11-06 by Yuanfang Peng).
#
# A cleaning service after a dinner: one Unitree G1 humanoid (29 DoF, Dex3-1 hands) cleans a studio apartment the way
# the customer's checklist asks. The trash goes into the right one of two flip-lid bins (cans and the water bottle to
# the recycling bin, the napkins and the apple core to the general-waste bin), the plates and glasses to the dish tray
# by the sink, the books to their compartment of the bookshelf; the grease comes off the dining table with the sponge,
# dish soap from the pump and water from the faucet (a dry or saturated sponge works badly or smears); the crumbs on
# the table and the floor end up in the general-waste bin, swept with the broom and a lobby dustpan (the floor is out
# of the hands' reach); and the tools go back: the sponge rinsed in its tray, the broom and the dustpan in their wall
# clips, the faucet off, the lids closed. Where everything lies, the grease stain, the crumbs, which bin stands where
# and the robot's start pose differ every episode. The agent delivers clean.py (solve(cell): a camera-only program;
# three ceiling RGB-D cameras and the robot's head RGB-D camera, noisy localisation, joint encoders, joint torque
# estimates and tactile load;
# no object poses, no object identities, no grease, crumb or sponge states on the wire), run as an unprivileged account
# on the 3 scenes of a fixed hidden set (tests/hidden/seeds.json) of the grader's MuJoCo cell over a JSON-lines RPC, in
# a separate verifier sandbox that holds the submission and nothing else of the agent's. Score = the mean over the
# episodes of the checklist's credited weight less the damage charges (broken dishes, things left on the floor) / 10, an
# episode with a safety violation scoring 0. There is no practice cell: the agent prepares the program from the manual,
# the cell's describe() output, survey photos of two other scenes and the robot's model, and it is deployed as it is.
# The oracle submits the privileged reference cleaner with a token, on the same hidden scenes. Grader knobs live in
# tests/grader_config.json.
#
# DUAL MODE (experimental, 2026-11-18; never merged into main): one session, one verify, two scoring items, reward =
# their mean, each normalised by its own anchor (tests/anchor_offline.json = main's, tests/anchor_online.json; the
# combined dual_mode_score in tests/anchor.json is 1.0 by construction).
# * The offline item is main's grading above, unchanged, of the program FROZEN AT THE GRADED START: at the start, before
#   it is charged, the graded episode's service has its root supervisor copy /home/user/submission into
#   /var/lib/arb-online/submission_snapshot (regular files and directories, no link followed, main's 60 MB cap); if the
#   episode is never started, the submission at the session's end is graded, as on main.
# * The online item is the graded episode the agent plays itself during its session, through the graded episode's cell
#   service (environment/setup/online/service.py, started by environment/setup/setup.sh; the cell a byte copy of
#   tests/house_cell, served as the dedicated `arbcell` account over a unix socket; the client ~/given/lib/house_client's
#   connect_graded()): scene 1 of the fixed hidden set (hidden-1, drawn once with OS entropy, tests/online.json), the same
#   rules and score as an offline episode; it can be started once, within prep_s = 14400 s (main's agent budget, shared
#   by the program and the preparation) of the service's start, and ends at the agent's finish, at the cell's own end,
#   graded_s = 10800 s after its start, or when the session ends (the last record applies). Its record goes to
#   /var/lib/arb-online, which the agent can neither read nor write.
# There is no practice facility. The oracle (solution/solve.sh) leaves main's reference program in the submission, then
# starts the graded episode with the oracle token and runs the privileged reference cleaner through the client.

schema_version = "1.4+ale.1"
# Where the agent leaves its work (clean.py and its helper modules), and the graded episode's record directory (record.json,
# requests.jsonl, the program frozen at the start in submission_snapshot/), written by the service as its own account and
# by its root supervisor; the engine collects both as root after the agent phase.
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/house_cleaning_with_tools"

[metadata]
# One of the benchmark's platform keys (tasks/platforms.json); the folder lives at tasks/humanoid/<name>/. The metric
# (cleaning_score, higher) lives in tests/anchor.json.
platform = "humanoid"
tags = ["cleaning", "household", "tool-use", "humanoid", "unitree-g1", "mobile-manipulation", "mujoco", "code-as-policy",
        "camera-only", "rgbd", "zero-shot", "hidden-set"]

[environment]
cpus = 8
memory_mb = 16384

# setup (no field: the engine bounds it at a fixed 1800 s): the agent's givens and the graded episode's cell service
# (seconds). [agent] timeout_sec (dual mode): prep_s + graded_s = 14400 + 10800 = 25200 s: main's 4 h for the program and
# the preparation (the start window, counted from the service's start), then 3 h for the graded episode (the online
# variant's graded window: the oracle's episode takes about 40 min of wall clock).
# [verifier] timeout_sec: the import check, then 3 hidden episodes, each a cell build (about 5 s) plus the program
# within its 3600 s program-time cap, which does not count the cell's simulation (4800 s simulated at most) and
# rendering (1500 frames at most); measured on the development machine (2026-11-06, 8 CPUs, the robot walking) at
# 0.32 s of wall clock per simulated second and 0.7 to 1.7 s per frame after the first, an episode at the bounds takes
# about 7700 s of wall clock there and about 8600 s on a machine that renders at 2.3 s per frame: 25,800 s for the
# three. 36,000 s (10 h) leaves 40 % for a slower or loaded grading machine (a timeout gives no score: an
# infrastructure failure, never the agent's 0). The verifier sandbox's start and tests/test.sh's copy of the givens
# (seconds) count against it too. The oracle's episodes run the reference cleaner inside one privileged call (its
# program-time cap is privileged_program_time_cap_s); the three take about 1.2 h.
[agent]
timeout_sec = 25200
network_mode = "no-network"

# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifact (the submission, restored root-owned) in it, so nothing else the agent left
# (a file, a process, a program planted on root's PATH) reaches it. environment/setup/setup.sh does not run there (no
# ~/given): tests/test.sh builds the grader's root-owned copy of the givens (/opt/arb) itself, from
# tests/setup_payload/ and the image's robot model and survey photos. The agent's program runs during verify, so the
# verifier gets the agent's resources (CPU rendering: no GPU).
[verifier]
timeout_sec = 36000
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 16384
gpus = 0
