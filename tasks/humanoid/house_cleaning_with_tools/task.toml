# house_cleaning_with_tools (Physical Execution, humanoid; built 2026-11-06 by Yuanfang Peng), ONLINE GRADED EPISODE
# variant (experimental, 2026-11-17; never merged into main).
#
# A cleaning service after a dinner: one Unitree G1 humanoid (29 DoF, Dex3-1 hands) cleans a studio apartment the way
# the customer's checklist asks. The trash goes into the right one of two flip-lid bins (cans and the water bottle to
# the recycling bin, the napkins and the apple core to the general-waste bin), the plates and glasses to the dish tray
# by the sink, the books to their compartment of the bookshelf; the grease comes off the dining table with the sponge,
# dish soap from the pump and water from the faucet (a dry or saturated sponge works badly or smears); the crumbs on
# the table and the floor end up in the general-waste bin, swept with the broom and a lobby dustpan (the floor is out
# of the hands' reach); and the tools go back: the sponge rinsed in its tray, the broom and the dustpan in their clips,
# the faucet off, the lids closed. Where everything lies, the grease stain, the crumbs, which bin stands where and the
# robot's start pose differ every episode. The robot is camera-only: three ceiling RGB-D cameras and the robot's head
# RGB-D camera, noisy localisation, joint encoders, joint torque estimates and tactile load; no object poses, no
# object identities, no grease, crumb or sponge states on the wire.
# Online variant: the agent drives ONE hidden graded episode itself during its session, through the graded episode's
# cell service (environment/setup/online/service.py, started by environment/setup/setup.sh; the offline verifier's own
# MuJoCo cell, a byte copy of tests/house_cell, served as the dedicated `arbcell` account over a unix socket; the
# agent-side client is ~/given/lib/house_client's connect_graded()). The episode is scene 1 of the offline verifier's
# fixed hidden set (tests/hidden/seeds.json), drawn once with OS entropy (tests/online.json), the same for every model;
# same rules as offline (4800 s simulated, 1500 camera frames, the safety watch, the checklist); the program-time,
# silence and CPU budgets and the program-contract gates of the offline wire do not carry over. It can be started once
# per session, within prep_s = 14400 s of the service's start, and ends at the agent's finish, at the cell's own end, at
# graded_s = 10800 s after its start, or when the session ends (the last record applies). The service writes the
# episode's record to /var/lib/arb-online (the agent can neither read nor write it); the separate verifier reads that
# record only (tests/verify.py): score = the episode's cleaning_score (the checklist's credit less the damage charges,
# / 10; 0 with a safety violation). There is no practice cell. The oracle (solution/solve.sh) starts the graded episode
# with the oracle token and runs the privileged reference cleaner through the agent-side client.

schema_version = "1.4+ale.1"
# /var/lib/arb-online: the graded episode's record (record.json, requests.jsonl), written by the cell service as its own
# account and collected as root after the agent phase; the verifier scores it. /home/user/submission is collected too
# (nothing reads it).
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/house_cleaning_with_tools"

[metadata]
# One of the benchmark's platform keys (tasks/platforms.json); the folder lives at tasks/humanoid/<name>/. The metric
# (cleaning_score, higher) lives in tests/anchor.json.
platform = "humanoid"
tags = ["cleaning", "household", "tool-use", "humanoid", "unitree-g1", "mobile-manipulation", "mujoco", "code-as-policy",
        "camera-only", "rgbd", "zero-shot", "hidden-set"]

[environment]
cpus = 8
memory_mb = 16384

# setup (no field: the engine bounds it at a fixed 1800 s): the givens and the graded episode's cell service (about 10 s:
# the cell's build). [agent] timeout_sec = prep_s + graded_s = 14400 + 10800: the start window (4 h, the offline task's
# agent budget, counted from the service's start, which precedes the session's start by the harness's install) and the
# graded window (3 h from the episode's start, the contract's default: the oracle's episode takes about 50 min of wall
# clock on the development machine, and an episode at its bounds, 4800 s simulated and 1500 frames, about 1.4 h of the
# cell's own time there).
[agent]
timeout_sec = 25200
network_mode = "no-network"

# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifacts (restored root-owned) in it; it runs no program and reads the graded
# episode's record, so its timeout and resources are small.
[verifier]
timeout_sec = 1800
environment_mode = "separate"

[verifier.environment]
cpus = 2
memory_mb = 4096
gpus = 0
