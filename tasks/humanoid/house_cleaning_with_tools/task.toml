# house_cleaning_with_tools (Physical Execution, humanoid; built 2026-11-06 by Yuanfang Peng).
#
# A cleaning service after a dinner: one Unitree G1 humanoid (29 DoF, Dex3-1 hands) cleans a studio apartment the way
# the customer's checklist asks. The trash goes into the right one of two flip-lid bins (cans and the water bottle to
# the recycling bin, the napkins and the apple core to the general-waste bin), the plates and glasses to the dish tray
# by the sink, the books to their compartment of the bookshelf; the grease comes off the dining table with the sponge,
# dish soap from the pump and water from the faucet (a dry or saturated sponge works badly or smears); the crumbs on
# the table and the floor end up in the general-waste bin, swept with the broom and a lobby dustpan (the floor is out
# of the hands' reach); and the tools go back: the sponge rinsed in its tray, the broom and the dustpan in their wall
# clips, the faucet off, the lids closed. Where everything lies, the grease stain, the crumbs, which bin stands where
# and the robot's start pose differ every episode. The agent delivers clean.py (solve(cell): a camera-only program;
# three ceiling RGB-D cameras and the robot's head RGB-D camera, noisy localisation, joint encoders and tactile load;
# no object poses, no object identities, no grease, crumb or sponge states on the wire), run as an unprivileged account
# on 3 hidden-seed episodes of the grader's MuJoCo cell over a JSON-lines RPC, in a separate verifier sandbox that holds
# the submission and nothing else of the agent's. Score = the mean over the episodes of the checklist's credited weight
# / 10, an episode with a safety violation scoring 0. During the agent phase a practice lab serves practice episodes of
# the same cell (never privileged, budget-limited) on a Unix socket. The oracle submits the privileged reference
# cleaner with a token. Grader knobs live in tests/grader_config.json.

schema_version = "1.4+ale.1"
# Where the agent leaves its work (clean.py and its helper modules).
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/house_cleaning_with_tools"

[metadata]
# One of the benchmark's platform keys (tasks/platforms.json); the folder lives at tasks/humanoid/<name>/. The metric
# (cleaning_score, higher) lives in tests/anchor.json.
platform = "humanoid"
tags = ["cleaning", "household", "tool-use", "humanoid", "unitree-g1", "mobile-manipulation", "mujoco", "code-as-policy",
        "camera-only", "rgbd", "practice-lab", "hidden-seed"]

[environment]
cpus = 8
memory_mb = 16384

# setup (no field: the engine bounds it at a fixed 1800 s): the agent's givens and the practice lab (its server builds
# one cell as a self-test before it listens; well under a minute). [agent] timeout_sec: 4 h, practice included.
# [verifier] timeout_sec: the import check, then 3 hidden episodes, each a cell build (about 5 s) plus the program
# within its 3600 s program-time cap, which does not count the cell's simulation (4800 s simulated at most) and
# rendering (1500 frames at most); measured on the development machine (2026-11-06, 8 CPUs, the robot walking) at
# 0.32 s of wall clock per simulated second and 0.7 to 1.7 s per frame after the first, an episode at the bounds takes
# about 7700 s of wall clock there and about 8600 s on a machine that renders at 2.3 s per frame, hence 7.5 h for the
# three. The verifier sandbox's start and tests/test.sh's copy of the givens (seconds) count against it too. The
# oracle's episodes run the reference cleaner inside one privileged call (its program-time cap is
# privileged_program_time_cap_s); the three must fit the same 7 h.
[agent]
timeout_sec = 14400
network_mode = "no-network"

# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifact (the submission, restored root-owned) in it, so nothing else the agent left
# (a file, a process, a program planted on root's PATH) reaches it. environment/setup/setup.sh does not run there (no
# ~/given, no practice lab): tests/test.sh builds the grader's root-owned copy of the givens (/opt/arb) itself, from
# tests/setup_payload/ and the image's robot model. The agent's program runs during verify, so the verifier gets the
# agent's resources (CPU rendering: no GPU).
[verifier]
timeout_sec = 27000
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 16384
gpus = 0
