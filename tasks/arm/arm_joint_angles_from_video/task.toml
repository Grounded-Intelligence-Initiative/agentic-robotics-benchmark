schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/arm_joint_angles_from_video"

[metadata]
platform = "arm"

[environment]
cpus = 4
memory_mb = 16384

[agent]
timeout_sec = 14400
network_mode = "no-network"

# Fixed hidden instances: the grader reads the lost logs from tests/ref (staged only at verify) in a fresh verifier
# sandbox and reads nothing the agent left besides the CSV files of /home/user/submission; nothing is executed.
[verifier]
timeout_sec = 900
environment_mode = "separate"

[verifier.environment]
cpus = 2
memory_mb = 4096
gpus = 0
