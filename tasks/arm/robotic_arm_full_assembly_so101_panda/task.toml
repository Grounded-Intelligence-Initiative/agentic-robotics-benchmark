# robotic_arm_full_assembly_so101_panda (information tier I1, assembly stage, the WHOLE arm from loose parts; built 2026-10-22
# from arm_assemble_six_servo_from_manual_panda_np on the owner's request: assemble the arm from the base with the
# Panda, physically: unpowered free joints, a coupling state machine, every part placed by the robot).
#
# The agent receives the print-frame kit of a HIDDEN variant of a six-servo desktop arm (STL files as delivered to the
# printer, kit.json, the servo's CAD and datasheet), the shop's 25-photo picture manual with physical scale references, the
# cell's commissioning document and API and the cell library; no practice. It delivers assemble.py (solve(cell): a
# camera-only program that builds the whole arm, 15 mates, from the base clamped on the fixture), run as an unprivileged
# account on 3 OS-entropy episodes of the grader's MuJoCo full-arm cell (tests/arm/assembly_full: the parts on the bench
# in stable orientations, placed and turned at random around a hidden bench plan; two uncalibrated RGB-D cameras, top and
# wrist, rendered by MuJoCo's Filament on CPU Vulkan in a baked factory hall; noisy F/T, no part poses, no mate events). Score = the episode mean of the fastened mates' weight / 18. The oracle submits
# the privileged reference assembler (tests/arm/assembly_full/reference.py) with a 256-bit token: it runs inside the cell
# on the bench plan's nominal layout. Grader knobs live in tests/grader_config.json.
#
# DUAL MODE (experimental, 2026-11-24; never merged into main): one session, one verify, two scoring items, reward =
# their mean, each normalised by its own anchor (tests/anchor_offline.json = main's, tests/anchor_online.json; the
# combined dual_mode_score in tests/anchor.json is 1.0 by construction).
# * The offline item is main's grading above, unchanged, of the program FROZEN at the earlier of the graded start and the
#   start window's close (prep_s after the service's start): then (before a start is charged) the graded episode's
#   service has its root supervisor copy /home/user/submission into /var/lib/arb-online/submission_snapshot (the agent's
#   own regular files and directories, no link followed, main's 60 MB cap), so the program keeps main's preparation
#   time; the submission at the session's end is graded only when the session ends before the window closes, without a
#   start, or there is no usable record.
# * The online item is the graded episode the agent plays itself during its session, through the graded episode's cell
#   service (environment/setup/online/service.py, started by environment/setup/setup.sh; the cell byte copies of the
#   verifier's cell code, the hidden kit, the hidden bench plan and the grader configuration, served as the dedicated
#   `arbcell` account over a unix socket; the client ~/given/lib/arm/assembly_info/graded.py's connect_graded()):
#   graded-01, one 63-bit episode seed drawn once with OS entropy (tests/online.json), the same rules and score as an
#   offline episode; it can be started once, within prep_s = 21600 s (main's agent budget, shared by the program and the
#   preparation) of the service's start, and ends at the agent's finish, at the cell's own end, graded_s = 10800 s after
#   its start, or when the session ends (the last record applies). Its record goes to /var/lib/arb-online, which the
#   agent can neither read nor write.
# There is no practice facility. The oracle (solution/solve.sh) leaves main's privileged program in the submission, then
# starts the graded episode with the oracle token (the cell rebuilt from the episode's seed in the privileged mode, as
# offline) and runs the reference assembler through the client.

schema_version = "1.4+ale.1"
# Where the agent leaves its program (assemble.py and its helper modules), and the graded episode's record directory
# (record.json, requests.jsonl, the program frozen at the start in submission_snapshot/, the replay record in trace/),
# written by the service as its own account and by its root supervisor; the engine collects both as root after the
# agent phase.
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/robotic_arm_full_assembly_so101_panda"

[metadata]
platform = "arm"
direction = "assembly"
metric = {name = "assembly_score", direction = "higher", hardware_invariant = true}
mode = "atomic"
stage = "assembly"
stage_key = "assembly"
info_tier = 1
hidden_instance = "H_asm2"
practice_instances = []
render_backend = "filament"
photo_set_version = "3"
given_from = {stage = "hardware-design", adapter = "A2-info"}
entry = "design-first"
route = "code-as-policy"
agent_role = ["assembly engineer", "assembly-cell programmer"]
artifact_kind = ["program"]
oracle_kind = "token-privileged"
compute = "cpu"
branch = {assembler = "panda", fastening = "coupling (on-feature hold, latch-on-seat, at-rest horn)", joints = "unpowered back-drivable", engine = "mujoco", observation = "cameras-only"}
observation_tier = "camera-only"
randomisation = ["bench layout (place, yaw) per episode", "fixture +-10 mm", "cameras (mount, intrinsics, distortion)", "lighting", "F/T bias"]
expert_time_hours = 60
siblings = ["arm_assemble_six_servo_from_manual_panda_np"]
tags = ["assembly", "mujoco", "panda", "code-as-policy", "camera-only", "rgbd", "calibration", "picture-manual", "hidden-variant", "full-arm", "oracle-token", "info-tier"]

[environment]
cpus = 8
memory_mb = 16384

# [agent] timeout_sec (dual mode): prep_s + graded_s = 21600 + 10800 = 32400 s: main's 6 h for the program and the
# preparation (the start window, counted from the service's start), then 3 h for the graded episode (the online
# variant's default graded window: the oracle's episode, the reference assembler inside one call, takes about 30-40 min
# of wall clock). [verifier] timeout_sec (main's): the collision pieces once (~5 min) + 3 x (cell build ~10 s + program
# <= 2400 s wall); the oracle's verify: 3 x the reference assembler (~500 s simulated, ~30-40 min wall each). The
# verifier sandbox's start and tests/test.sh's copy of the givens count against it too.
[agent]
timeout_sec = 32400
network_mode = "no-network"

# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifact (the submission) restored into it, so nothing else the agent left (a file,
# a process, a program planted on root's PATH) reaches it. environment/setup/setup.sh does not run there: tests/test.sh
# builds the grader's root-owned copy of the givens itself. The agent's program runs during verify, beside the cell
# and its own camera renderer, so the verifier gets the agent's CPUs and more memory than the agent: 24 GB (at
# 16 GB a program that held a twin session of its own got the grader killed in the third episode). CPU rendering:
# no GPU.
[verifier]
timeout_sec = 14400
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 24576
gpus = 0
