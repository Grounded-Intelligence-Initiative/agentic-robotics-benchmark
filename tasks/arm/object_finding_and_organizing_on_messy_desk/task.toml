# TEMPLATE — a complete robotics task that scores green as shipped. Change it into yours
# one field at a time; `ale validate` after each change tells you if you broke it.

schema_version = "1.4+ale.1"

# Where the agent leaves its work, and (online variant) the graded episode's record: the service writes
# /var/lib/arb-online as its own account (0700); the engine collects it as root after the agent phase and
# restores it, root-owned, in the separate verifier, which scores the record and reads nothing else.
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

# The task's stable identity, "<org>/<slug>". The org is grounded-intelligence-initiative,
# the GitHub and Hugging Face organization that owns the benchmark, for every task here.
# The slug, the part after the "/", is yours: collection-unique, ^[a-z0-9][a-z0-9_-]*$,
# preferably snake_case. Pick it before anything else: it is the Task Name registered in
# the project's sheet, and once the task lands at tasks/<platform>/<slug>/ the folder must
# carry the same name (the domain lint checks).
[task]
name = "grounded-intelligence-initiative/object_finding_and_organizing_on_messy_desk"

# Free-form values with no runtime behavior; this repository reads one of them.
# platform: one of the benchmark's platform keys (tasks/platforms.json in this repository):
#   arm | hand | quadruped | humanoid | uav | driving | underwater | space | soft |
#   surgical | swarm | subsystems
# It also names the tasks/<platform>/ folder the task lands in. A platform that is not on
# the list needs a maintainer to add it to tasks/platforms.json first.
# The metric and its direction live in tests/anchor.json (`metric`, `direction`): an
# OUTCOME on a positive scale (success_rate, reward, SPL, ATE, collision_rate, or a cost
# with direction lower), never a wall-clock time, throughput, FPS or frequency, which
# measure the machine, not the method.
[metadata]
platform = "arm"

# The agent's machine. environment/Dockerfile builds it, with environment/ less setup/ as
# the build context; its FROM names the ALE base at an exact version (lint rejects `latest`
# and an untagged FROM). A prebuilt image works too: `docker_image = "ghcr.io/...:tag"`
# here, and delete environment/Dockerfile (an image named directly wins over a build).
# The GPU models the task has been tested on, cheapest first: Daytona tries them in this order.
[environment]
cpus = 8
memory_mb = 32768
gpus = 1
gpu_types = ["RTX-4090"]

# Setup (environment/setup/setup.sh: staging the agent-visible material, then starting the graded
# episode service, which warms its simulator's shader cache before it serves: 270-620 s measured cold)
# has no field: the engine bounds it at a fixed 1800 s.
# [agent] timeout_sec (online variant) = prep_s + graded_s = 3600 + 14400. prep_s is the task's agent
# budget on main (1 h): the graded episode must be started within it. graded_s is 4 h instead of the
# default 3 h because the simulation itself needs about an hour of wall time: 20000 steps at 0.15-0.25 s a
# step measured on an RTX 4090 host; the privileged reference's own online episode took 3468 s
# (ale validate run validate-abe7f0f5) in a sandbox where nothing else ran, and an agent's desk lab and
# perception share the same GPU and 8 CPUs. Offline the program had 3000 s of its own time on top of the
# simulation. The service enforces both windows (environment/setup/online/online.json).
[agent]
timeout_sec = 18000
network_mode = "no-network"

# [verifier] timeout_sec (online variant): the grader runs no program and no simulator; it reads the
# graded episode's record (/var/lib/arb-online/record.json) and scores it, in seconds.
#
# Grader knobs live in tests/grader_config.json, never in this file: [metadata] has no
# runtime behavior, and episode counts are the grader's business anyway. Not
# tests/config.json either: the engine writes its own file under that name at verify time.
#
# There is no admission bar in this file. `ale validate` runs the task twice: an untouched
# sandbox must score reward 0.0, and the oracle, run in place of the agent, must score 1.0,
# both after the engine rounds `reward` to two decimals. Either miss fails validation
# (`untouched_nonzero`, `oracle_not_full`). The tolerance that lets the reference land on 1.0
# on the fixed hidden episodes is `full_at` in tests/anchor.json, sized from its measured
# run-to-run spread. See that file.
[verifier]
timeout_sec = 600
# Separate verification (2026-11-04): a fresh verifier sandbox from the same image, which the agent never touched;
# only the declared artifacts are restored into it. Online variant: the graded episode's record is the one input.
environment_mode = "separate"

# The verifier only reads a file: no GPU.
[verifier.environment]
cpus = 1
memory_mb = 4096
gpus = 0
