# arm_replica_requirements_from_photos: the requirements stage of the robotic-arm full-stack workflow (an atomic task). The
# agent specifies ten upgraded replicas of a six-servo desktop arm that is no longer on the bench, known only from one
# fixed photo set (31 photos rendered with Blender Cycles in a lab room, sparse physical scale references), a build log,
# a customer brief with a public acceptance procedure, vendor datasheet pages and two servo-lot reports (images only)
# and a distributor quote. It delivers requirements.yaml, bom.json and kinematic_sketch.json.
#
# Grading (verify/verify.py; knobs in verify/grader_config.json; static, no agent code runs): gates G0 structure and G1
# submission integrity (verify-start lockdown) x kinematic_replication 0.30, requirements_sheet 0.10,
# derived_requirements 0.20, bom_acceptance 0.10 (the acceptance verdict on the true arm with the delivered lot's weakest
# expected unit), bom_economy 0.30 (linear from the live true optimum J* to J* + one engineering change, on the
# ECO-repaired cost). requirements_score = the weighted mean; reward = requirements_score (verify/anchor.json).

spec_type: core/v1

name: arm_replica_requirements_from_photos

image: {kind: container}

resources: {cpus: 4, memory_mb: 8192}
network: {mode: block}

# setup: stage the payload into the agent home (< 30 s). agent: photogrammetry on 31 photos, 30 document pages and two
# lot reports read from images, a dynamics model and a BOM search (3-5 h of focused work). verify: lockdown, the
# acceptance set, the regressor, the live optimum search (about 10-30 s).
timeouts: {setup: 300, agent: 14400, verify: 900}

artifacts: [/home/user/submission]

metadata:
  platform: arm
