# Pantry jar refilling: two fixed Pandas at a kitchen counter refill screw-top jars from a refill list, from RGB
# cameras and wrist force sensors: open each listed jar (one hand holds it, the other unscrews the lid in regrasp
# cycles), drop in the listed pieces of the jar's kind from a tray, put the jar's own lid back and close it to a
# torque window. Each unit's jars differ in thread turns, running torque, mass, friction and size (hidden); each
# episode draws where the jars stand, the list and the tray. The grader drives the agent's controller over a stdio
# wire on a fixed hidden set of 12 episodes.

# DUAL MODE (experiment, branch exp/dual-mode-scoring; never merged into main): one session, one verify, two items, the
# reward their mean. The program item is main's, unchanged: the controller in /home/user/submission/ on the 12 hidden
# episodes (tests/offline_verify.py, main's tests/verify.py), on the program frozen when the agent starts the graded
# episode (the graded episode's root supervisor copies /home/user/submission into the root-only
# /var/lib/arb-online/submission_snapshot/ before the start is charged), or when the start window closes without a
# start, or the session-end submission if the session ends before that. The online item is one graded episode, ep06 of
# that set (unit u1), played live through the graded episode's service (environment/setup/online/). tests/verify.py
# grades both (main's grading, then the record) and writes one reward. The declared artifacts: where the agent leaves
# its controller, and the graded episode's record with the frozen program (the service's directory, which the agent
# can neither read nor write).

schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/pantry_jar_refilling"

[metadata]
platform = "arm"

[environment]
cpus = 4
memory_mb = 12288

# prep_s + graded_s: main's 2 h for the controller and the agent's preparation (the window in which the graded episode
# must be started, counted from the service's start, a little before the session's; no trials on the hidden units, the
# full simulator with two practice units is in the agent's home) plus the 3 h graded window that follows the start (the
# default; one episode of at most 12000 steps needs minutes of simulation).
[agent]
timeout_sec = 18000
network_mode = "no-network"

# 12 episodes (2 per hidden unit), each at most 12000 control steps. The grader's budget (grader_config.json:
# 9000 s) is the controller's own time: its replies, plus 0.2 s for every image it asks for; the simulation is not
# in it, so the timeout covers both. Worst case: 144000 control steps at 45 ms (10-25 ms measured on idle hosts, the
# higher figure for a busy 4-CPU sandbox) = 6480 s of simulation; 9000 s of controller time (if the whole budget
# went into images, 45000 of them, drawing them takes less than their price); the numerics check, the clearing of
# the account and the render self-test 60 s. 15540 s; with 35 % margin 21000 s. The reference's whole verify takes
# about 35-65 minutes. The dual mode: main's verifier, since main's offline grading runs again; the record takes seconds.
[verifier]
timeout_sec = 21600
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 12288
gpus = 0
