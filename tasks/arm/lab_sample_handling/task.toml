# Lab sample handling: a fixed Panda at a lab bench processes a worklist of capped, opaque sample tubes from its
# cameras, wrist force sensor and a bench scale: some go to named positions of a cold rack, the others are weighed and
# loaded into a fixed-angle centrifuge rotor as balanced opposite pairs with the tubes already in it, through a
# shield's single loading port (which needs the one-way rotor turned by hand, its answer to a turn hidden per unit),
# then the lid is closed. Every instrument's pose is drawn per episode. The credit is the centrifuge run's: nothing
# without a rotor that could be started (the lid shut, every tube in it half of a balanced pair). The agent has no
# simulator: it has the equipment's sheets and a commissioning service (environment/commission_service/, its own
# account, a socket with the public wire only, three development units, 48000 control steps, no truth and no
# credit). The grader drives the agent's controller over a stdio wire on a fixed hidden set of 12 episodes.
# Structure after tasks/arm/kitchen_appliance_tending; the service after tasks/arm/pump_skid_startup_and_operation.
#
# DUAL MODE (experiment, branch exp/dual-mode-scoring; never merged into main): one session, one verify, two items, the
# reward their mean. The controller item is main's, unchanged: the controller on the 12 hidden episodes with main's
# budgets, probe lock and gates (tests/offline_verify.py, byte-identical to main's tests/verify.py), on the controller
# frozen when the agent starts the graded episode (the graded episode's root supervisor copies /home/user/submission
# into the root-only /var/lib/arb-online/submission_snapshot/ before the start is charged), or when the 2-hour start
# window closes without a start, or on the session-end submission if the session ends before either. The online item
# is one episode of the hidden set (hidden-02, unit u1, drawn with OS entropy), played live through the graded
# episode's service (environment/setup/online/); the commissioning service closes when it starts (O13).
# tests/verify.py grades both (main's grading, then the record) and writes one reward.

schema_version = "1.4+ale.1"
# Where the agent leaves its controller (the controller item grades it as frozen at the graded start or at the close
# of the start window, or as it is at the session's end if the session ends before either) and the graded episode's
# record with the frozen controller (the service's directory, which the agent can neither read nor write).
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/lab_sample_handling"

[metadata]
platform = "arm"

[environment]
cpus = 4
memory_mb = 12288

# prep_s 7200 (main's 2 h, as the appliance task, shared by the controller and the preparation: commissioning on the
# development units, which are other units of the series, writing and testing the controller; the graded episode must
# start within it) + graded_s 10800 (the graded episode's own window after its start, the default: the episode's
# simulation needs at most about 10-20 minutes of it, 20000 steps at 30-45 ms plus the images asked for).
[agent]
timeout_sec = 18000
network_mode = "no-network"

# 12 episodes (2 per hidden unit), each at most 20000 control steps. The grader's budget (grader_config.json:
# 9000 s) is the controller's own time: its replies, plus 0.2 s for every image it asks for; the simulation is not
# in it, so the timeout covers both. Worst case: 240000 control steps at 45 ms (20-30 ms measured, the higher figure
# over the wire on a busy 4-CPU sandbox) = 10800 s of simulation; 9000 s of controller time (if the whole budget
# went into images, 45000 of them, drawing them at 0.10-0.15 s each would take less than that); the numerics check,
# the empty-account check and the render self-test 30 s. 19830 s; with 35 % margin 26800 s. The reference's whole
# verify takes about 80 minutes. The verifier image (tests/Dockerfile) runs no desktop session. Dual mode: main's
# timeout, since main's grading runs again (on the frozen controller); reading the record takes seconds.
[verifier]
timeout_sec = 27000
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 12288
gpus = 0
