schema_version = "1.4+ale.1"

# Where the agent leaves its work: a controller program (run.sh and whatever it needs).
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/cable_routing_through_clips"

[metadata]
platform = "arm"

# 8 CPUs, no GPU: the agent develops its controller against the practice cell (a MuJoCo service started by setup,
# up to four episodes at a time, frames drawn on the CPU).
[environment]
cpus = 8
memory_mb = 16384

# 4 hours (instruction.md "Session time", environment/setup/payload/session_time.sh LIMIT_MIN=240).
[agent]
timeout_sec = 14400
network_mode = "no-network"

# Verify: 12 fixed hidden episodes, each at most 1500 control steps; a step is about 0.3 s of simulation and drawing
# plus the controller's reply, and the controller's replies may take 3600 s in all (tests/grader_config.json).
[verifier]
timeout_sec = 10800
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 8192
gpus = 0
