<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<!-- Initial FreeCAD preferences of the task session: no Start page and no first-start setup panel (millimetres are
     FreeCAD's default unit system); the user may change any preference in the session. -->
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="Mod">
          <FCParamGroup Name="Start">
            <FCBool Name="FirstStart2024" Value="0"/>
            <FCBool Name="ShowOnStartup" Value="0"/>
          </FCParamGroup>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
