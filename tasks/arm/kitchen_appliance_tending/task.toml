# Kitchen appliance tending: a fixed Panda in front of a kitchen appliance it has not seen (a cooktop, a microwave or
# a wall oven) turns burners on, off and to a setting, preheats, sets and turns off the oven and starts and stops the
# microwave, on text requests, from its cameras and wrist force sensor. Online graded episode (experimental variant):
# the agent plays one hidden graded episode itself (one entry of the offline grader's fixed hidden set), through the
# lab service, and the separate verifier scores the record the lab leaves in /var/lib/arb-online (a declared
# artifact). Structure after tasks/arm/arm_hidden_mechanism_box.

schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/kitchen_appliance_tending"

[metadata]
platform = "arm"

[environment]
cpus = 4
memory_mb = 12288

# prep_s 7200 (the 2 h budget on main: exploring the practice units in the dev sim, the one lab trial, building the
# tools; the graded episode must start within it) + graded_s 10800 (the episode's own window after its start).
[agent]
timeout_sec = 18000
network_mode = "no-network"

# The grader only reads the record.
[verifier]
timeout_sec = 600
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 12288
gpus = 0
