# Kitchen appliance tending: a fixed Panda in front of a kitchen appliance it has not seen (a cooktop, a microwave or
# a wall oven) turns burners on, off and to a setting, preheats, sets and turns off the oven and starts and stops the
# microwave, on text requests, from its cameras and wrist force sensor. Dual mode (experimental variant): one session,
# one verify, two scoring items: the controller the agent leaves in /home/user/submission (main's task, graded by
# main's grader on the fixed hidden set of 18 episodes), frozen at the graded start, and one hidden graded episode it
# plays itself through the lab (the first entry of a random order of that set whose unit no lab trial used); the
# reward is the mean of the two. The verifier reads the snapshot and the lab's record from /var/lib/arb-online (a
# declared artifact). Structure after tasks/arm/arm_hidden_mechanism_box.

schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/kitchen_appliance_tending"

[metadata]
platform = "arm"

[environment]
cpus = 4
memory_mb = 12288

# prep_s 7200 (main's 2 h budget, shared by the program and the preparation: exploring the practice units in the
# dev sim, the one lab trial, writing and testing the controller and the tools; the graded episode must start
# within it) + graded_s 10800 (the episode's own window after its start).
[agent]
timeout_sec = 18000
network_mode = "no-network"

# Main's: the verifier runs main's grading of the program again (18 episodes, its own 6000 s budget, the solver's
# start, the egress self-test and the stops), then reads the record.
[verifier]
timeout_sec = 7200
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 12288
gpus = 0
