[program:gnome]
command=/usr/local/bin/start-desktop.sh
autostart=true
autorestart=true
user=user
environment=HOME="/home/user",USER="user",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/runtime-user",XDG_CONFIG_HOME="/home/user/.config",XDG_DATA_DIRS="/usr/share:/usr/local/share",XDG_SESSION_TYPE="x11"
priority=30
stdout_logfile=/var/log/supervisor/gnome.log
stderr_logfile=/var/log/supervisor/gnome.err
