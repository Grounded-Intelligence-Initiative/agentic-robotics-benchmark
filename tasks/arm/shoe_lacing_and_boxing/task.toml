# shoe_lacing_and_boxing (Physical Execution, robotic arm; built 2026-10-30 by Yuanfang Peng), ONLINE VARIANT
# (experimental, 2026-11-17: the graded episode).
#
# A two-arm MuJoCo finishing cell at the end of a sneaker line: for each episode's pair, the cell must seat each shoe in the
# lacing cradle, lace it criss-cross through its eyelet rows with the lacing hook and the gripper, erect the flat
# shoe-box blank, pack the laced pair, set the lid tray on it and push the box to the outfeed. The cell is camera-only:
# three fixed RGB-D cameras and a wrist camera per arm; no object poses, no eyelet positions, no lace or box state on the
# wire. In this variant the agent plays ONE graded episode itself, during its session, through the graded service that
# environment/setup/setup.sh starts (environment/setup/online/server.py: the offline grader's own cell on the episode
# drawn from its hidden set, served as the dedicated account `arbonline` on a unix socket; the agent's client is
# shoecell.client.connect_graded). The service keeps the episode's record in /var/lib/arb-online, which the agent can
# neither read nor write; the engine collects it as a declared artifact and tests/verify.py scores it: the cell's work
# score of that episode (per pair: the lacing of each shoe, the box erected, and packed / closed / shipped credited in
# proportion to the pair's laced shoes; a safety violation voids the pair at work). Nothing else of the agent is graded.
# The oracle plays the graded episode with the privileged reference program (a 256-bit token). Grader knobs live in
# tests/grader_config.json (the cell's configuration; the service runs a byte copy of it).

schema_version = "1.4+ale.1"
# The graded service's record directory (the score's only input) and, for the record, the agent's working folder (not
# read by the grader).
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/shoe_lacing_and_boxing"

[metadata]
# One of the benchmark's platform keys (tasks/platforms.json); the folder lives at tasks/arm/<name>/. The metric
# (work_score, higher) lives in tests/anchor.json.
platform = "arm"
tags = ["lacing", "packaging", "shoe", "deformable-linear-object", "panda", "multi-robot", "bimanual", "mujoco",
        "code-as-policy", "camera-only", "rgbd", "hidden-seed", "oracle-token", "online-graded-episode"]

[environment]
cpus = 8
memory_mb = 16384

# setup (no field: the engine bounds it at a fixed 1800 s): the givens in the agent home, the graded service's copy of
# them and the service itself (about 10 s: it builds the graded episode's cell before it answers). [agent] timeout_sec =
# prep_s + graded_s of environment/setup/online/online.json: the graded episode must be started within 14400 s (4 h,
# the offline variant's agent budget) of the service's start and then runs for at most 10800 s (3 h, the default
# window; the oracle's episode takes 10-20 min of wall clock inside one request).
[agent]
timeout_sec = 25200
network_mode = "no-network"

[verifier]
timeout_sec = 1800
# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifacts (the submission folder and the graded service's record directory) restored
# into it, so nothing else the agent left reaches it. environment/setup/setup.sh does not run there. It runs no program:
# it reads the record (seconds), hence the small timeout and resources.
environment_mode = "separate"

[verifier.environment]
cpus = 2
memory_mb = 4096
gpus = 0
