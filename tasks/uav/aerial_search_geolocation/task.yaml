spec_type: core/v1

# Aerial search and geolocation: the agent builds a controller that flies a quadrotor
# through unseen TravelUAV scenes (Unreal Engine with the AirSim plugin), finds the targets
# it is given as text, and reports each one's position or declares it absent.
name: aerial_search_geolocation

image: {kind: container}

# One GPU renders the scene (offscreen Vulkan) and runs whatever models the controller uses.
resources: {cpus: 8, memory_mb: 32768, gpus: 1}
network: {mode: block}

# verify: 24 missions of up to 150 actions each, with scene start-up and up to 30 s per reply.
timeouts: {setup: 300, agent: 3600, verify: 14400}

artifacts: [/home/user/submission]

# The grading run needs scenes the agent must never see, so it runs in its own sandbox
# built from verify/Dockerfile (held-out scenes + hidden object pool). The submission is
# carried over from the agent's sandbox.
verify:
  environment_mode: separate
  image: {kind: container}
  resources: {cpus: 8, memory_mb: 32768, storage_mb: null, gpus: 1}

metadata:
  platform: uav
  # The reference expert is graded with an oracle token (oracle/reference/oracle_token,
  # sha256 in verify/hidden/): with it, observations carry the placed objects' true positions.
  oracle_kind: token-privileged
