# uav_assembly_agipix_xarm7 (assembly stage: a quadrotor airframe from 23 loose components with an xArm 7; built from
# 2026-10-27, the UAV sibling of the arm assembly tasks; kit moved to the source CAD meshes 2026-10-29; renamed from
# unmanned_aerial_vehicle_assembly_agipix_xarm7 on 2026-11-09).
#
# The agent receives the adapted AGiPix kit (CC0 source: every component's source meshes, the convex collision pieces the
# cell simulates, quantities, masses, rest orientations and manufacturing notes, given/kit/kit.json), the stock xArm 7 +
# gripper model (MuJoCo Menagerie), the 27-diagram picture manual, the cell's commissioning document (given/cell.md), the
# connection client, the cameras' scenery and their renderer for its own twin of the cell or any scene (given/lib:
# cell_render, a port of tests/rendering.py taking the twin and its camera mounts as arguments, and the render layer with
# render.filament.view; the runner puts given/lib on the program's import path); no practice cell. It delivers
# assemble.py (solve(cell): a camera-only program that mounts the 23 components, 23 mates, onto the lower chassis
# clamped on a raised fixture), run as `nobody`
# on 3 OS-entropy episodes of the grader's MuJoCo cell (tests/cell.py: free-jointed components with convex collision
# pieces, staged on the bench at drawn slots and yaws, the fixture and the cameras jittered; uncalibrated top and wrist
# RGB-D, RGB rendered by MuJoCo's Filament on CPU Vulkan in a baked workshop, depth by OSMesa; joint encoders and a
# biased, noisy wrist wrench; no part poses, no mate events). Fastening is an at-rest coupling: a component held still
# for 0.5 s within 1.5 mm and 8 deg of its mate is welded at the pose it reached, never pulled to the nominal one, and
# counts within 3 deg. Score = the episode mean of the counted mates / 23, an unsafe episode scoring 0 (non-pad robot
# contact > 30 N, a component > 3 m/s, a component load > 150 N for 0.2 s). The oracle submits a 256-bit token:
# the privileged physical reference (tests/reference.py, tests/motion.py) runs inside the cell on the nominal layout; it
# reads ground-truth poses to plan and moves the components only through the arm's bounded actuators and pad friction.
# Grader knobs live in tests/grader_config.json.
#
# DUAL MODE (experimental, 2026-11-24; never merged into main): one session, one verify, two scoring items, reward =
# their mean, each normalised by its own anchor (tests/anchor_offline.json = main's anchor.json,
# tests/anchor_online.json; the combined dual_mode_score in tests/anchor.json is 1.0 by construction).
# * The offline item is main's grading above, unchanged (tests/offline_verify.py = main's tests/verify.py byte for byte,
#   run by tests/verify.py in a root-only copy of tests/ laid out as main's), of the program FROZEN at the earlier of the
#   graded start and the start window's close (prep_s after the service's start): then (before a start is charged) the
#   graded episode's service has its root supervisor copy /home/user/submission into
#   /var/lib/arb-online/submission_snapshot (regular files and directories, no link followed, main's 60 MiB cap), so the
#   program keeps main's preparation time; the submission at the session's end is graded only when the session ends
#   before the window closes, without a start, or there is no usable record.
# * The online item is the graded episode the agent plays itself during its session, through the graded episode's cell
#   service (environment/setup/online/service.py, started by environment/setup/setup.sh; the cell a byte copy of the
#   cell's part of tests/, served as the dedicated `arbcell` account over a unix socket; the client ~/graded_client.py,
#   connect_graded()): one workcell drawn as the offline verifier draws its episodes, its 63-bit seed drawn once with OS
#   entropy (tests/online.json), the same rules and score as an offline episode; it can be started once, within prep_s =
#   21600 s (main's agent budget, shared by the program and the preparation) of the service's start, and ends at the
#   agent's finish, at the workcell's own end, graded_s = 10800 s after its start, or when the session ends (the last
#   record applies). Its record goes to /var/lib/arb-online, which the agent can neither read nor write.
# There is no practice facility. The oracle (solution/solve.sh) leaves main's reference program in the submission, then
# starts the graded episode with the oracle token and runs the privileged reference through the client (on the nominal
# layout of the episode's seed, as the offline grader runs a privileged program).

schema_version = "1.4+ale.1"
# Where the agent leaves its work (assemble.py and its helpers), and the graded episode's record directory (record.json,
# requests.jsonl, the program frozen at the start in submission_snapshot/, the episode record trace/), written by the
# service as its own account and by its root supervisor; the engine collects both as root after the agent phase.
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/uav_assembly_agipix_xarm7"

[metadata]
platform = "uav"
direction = "assembly"
metric = {name = "assembly_score", direction = "higher", hardware_invariant = true}
mode = "atomic"
stage = "assembly"
stage_key = "assembly"
info_tier = 1
practice_instances = []
render_backend = "filament"
entry = "design-first"
route = "code-as-policy"
agent_role = ["assembly engineer", "workcell programmer"]
artifact_kind = ["program"]
oracle_kind = "token-privileged"
compute = "cpu"
branch = {assembler = "xarm7 (stock parallel gripper)", fastening = "coupling (on-feature hold, at-rest weld at the reached pose)", joints = "four unpowered rotor hinges (propellers mount on the rotors)", engine = "mujoco", observation = "cameras-only"}
observation_tier = "camera-only"
randomisation = ["bench layout (slot, +-4 mm, yaw +-0.2 rad) per episode", "fixture +-10 mm", "cameras (mount, orientation, focal length)", "F/T bias"]
expert_time_hours = 80
siblings = ["robotic_arm_full_assembly_so101_panda", "robotic_arm_full_assembly_openarm_panda"]
tags = ["assembly", "mujoco", "xarm7", "agipix", "quadrotor", "code-as-policy", "camera-only", "rgbd", "calibration", "picture-manual", "contact", "planning", "oracle-token"]
source_platform = "AGiPix-derived mechanical assembly kit"

[environment]
cpus = 8
memory_mb = 16384

# [agent] timeout_sec (dual mode): prep_s + graded_s = 21600 + 10800 = 32400 s: main's 6 h for the program and the
# preparation (the start window, counted from the graded episode's service's start), then 3 h for the graded episode
# (the online variant's graded window; the privileged reference's episode takes about 25-80 min by host load, within
# it). The agent's sandbox also holds the graded episode's service: about 1.4 GB while it waits, about 6.5 GB once its
# cameras have rendered (the workcell and its Filament camera session).
# [verifier] timeout_sec 25200 s (7 h): an agent's verify is 3 workcells x (the cell build and camera session, under a
# minute, + the program's <= 7200 s wall cap) = at most ~21800 s; the oracle's is 3 x the privileged reference, ~25-80
# min each by host load (a fresh 23/23 run: 1132 s simulated, 1438 s wall on an idle 24-core host, about 3x that on a
# loaded one), each capped at 10800 s (a cap for one runaway episode, not for three). The verifier sandbox's start and
# tests/test.sh's copy of the givens count against it too. Dual mode: the verify stage runs main's grading again (its
# time above) and reads the graded episode's record (seconds).
[agent]
timeout_sec = 32400
network_mode = "no-network"

# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifacts (the submission and the graded episode's record directory, both written
# root-owned by the engine) restored into it, so nothing else the agent left (a file, a process, a program planted on
# root's PATH) reaches it. environment/setup/setup.sh does not run there: tests/test.sh
# builds the grader's root-owned copy of the givens itself. The agent's program runs during verify (beside the cell and
# the cell's own Filament camera session), so the verifier gets the agent's CPUs (CPU rendering: no GPU) and 24 GB: a
# program that renders through the given layer and the cell's camera session share it (in a local graded rehearsal of
# three workcells the grader's process held up to about 9.5 GB and the program up to about 7 GB, about 16 GB together).
[verifier]
timeout_sec = 25200
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 24576
gpus = 0
