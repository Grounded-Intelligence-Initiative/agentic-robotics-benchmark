schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/unmanned_aerial_vehicle_assembly_agipix_xarm7"

[metadata]
platform = "uav"
stage = "assembly"
mode = "atomic"
route = "code-as-policy"
agent_role = ["assembly engineer", "workcell programmer"]
artifact_kind = ["program"]
compute = "cpu"
observation_tier = "camera-only"
render_backend = "filament"
tags = ["agipix", "xarm7", "mujoco", "assembly", "rgbd", "contact", "planning"]
source_platform = "AGiPix-derived mechanical assembly kit"
development_status = "native-mesh-reference-validation-pending"

[environment]
cpus = 8
memory_mb = 16384

# [agent] timeout_sec: 6 h; [verifier] timeout_sec: 3 x (cell and camera session build, under a minute, + program
# <= 3600 s wall); the oracle's verify: 3 x the privileged reference (<= 7000 s wall each). The verifier sandbox's start
# and tests/test.sh's copy of the givens count against it too.
[agent]
timeout_sec = 21600
network_mode = "no-network"

# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifact (the submission) restored into it, so nothing else the agent left (a file,
# a process, a program planted on root's PATH) reaches it. environment/setup/setup.sh does not run there: tests/test.sh
# builds the grader's root-owned copy of the givens itself. The agent's program runs during verify, so the verifier
# gets the agent's resources (CPU rendering: no GPU).
[verifier]
timeout_sec = 21600
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 16384
gpus = 0
