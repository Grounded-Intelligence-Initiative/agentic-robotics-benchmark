spec_type: core/v1
name: time_limited_search_and_rescue
image:
  kind: container
resources:
  cpus: 2
  memory_mb: 4096
  gpus: 0
network:
  mode: block
timeouts:
  setup: 120
  agent: 1800
  verify: 900
artifacts:
- /home/user/submission
tools:
  mcp_servers:
  - path: tools/mcp/robot.toml
metadata:
  platform: uav
