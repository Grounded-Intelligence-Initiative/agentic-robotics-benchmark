schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/visual_low_level_flight_control"

[metadata]
platform = "uav"

[environment]
cpus = 2
memory_mb = 4096
gpus = 0

# The robot service's MCP bridge, which setup copies from environment/setup/payload/ into the root-owned
# /opt/visual_robotics/client. Before the Harbor format its descriptor also set cwd = "/home/user"; task.toml has no
# such field, and the bridge needs no wrapper to replace it, because nothing in it depends on the working directory:
# Python resolves its one local import (client.py) from the script's own folder, and the bridge uses only stdin,
# stdout and the world socket, at an absolute path.
[[environment.mcp_servers]]
name = "robot"
transport = "stdio"
command = "/opt/venv/bin/python3"
args = ["/opt/visual_robotics/client/mcp_stdio.py"]

[agent]
timeout_sec = 3600
network_mode = "no-network"

# Separate verification: tests/test.sh runs as root in a fresh verifier sandbox started from the task image, into which
# the engine restores only the declared artifact, /home/user/submission. Nothing else the agent left in its own sandbox
# reaches the grader: no program it put on root's PATH (the base image leaves /usr/local/bin agent-writable and ahead of
# /usr/bin), no other file under /home/user or /tmp, no process. setup.sh does not run there, so the exploration world
# service, its ledger under /var/lib/visual_robotics and the public client copies are absent, and the grader reads none
# of them: what it needs is in tests/ (the scene, the renderer, the kit) or in the image (/opt/venv, the Crazyflie model
# under /opt/visual_robotics/assets, the render assets under /opt/task-assets/payload/render). The verifier gets the
# agent's machine, 2 CPUs and 4 GB without a GPU: the controller's replies are timed (10 s each, 1500 s in all) on the
# CPUs it was developed on, and the verify process peaks at about 1.3 GB. timeout_sec is unchanged: releasing the
# agent's sandbox, starting the verifier and restoring the submission took about 6 s of it (validate-9f8d0503, whose
# verify ran 22.8 min).
[verifier]
timeout_sec = 5400
environment_mode = "separate"

[verifier.environment]
cpus = 2
memory_mb = 4096
gpus = 0
