schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/visual_low_level_flight_control"

[metadata]
platform = "uav"

[environment]
cpus = 2
memory_mb = 4096
gpus = 0

# The robot service's MCP bridge, which setup copies from environment/setup/payload/ into the root-owned
# /opt/visual_robotics/client. Before the Harbor format its descriptor also set cwd = "/home/user"; task.toml has no
# such field, and the bridge needs no wrapper to replace it, because nothing in it depends on the working directory:
# Python resolves its one local import (client.py) from the script's own folder, and the bridge uses only stdin,
# stdout and the world socket, at an absolute path.
[[environment.mcp_servers]]
name = "robot"
transport = "stdio"
command = "/opt/venv/bin/python3"
args = ["/opt/visual_robotics/client/mcp_stdio.py"]

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 5400
