# endoscope_camera_assistance_from_video (surgical; provisional name: not yet registered in the coordination sheet).
#
# A four-joint camera holder (pan, tilt, insertion, roll about the trocar's remote centre of motion) carries a
# laparoscope and has to keep the surgeon's two working instruments in a usable view while a recorded procedure plays.
# The agent writes the holder's controller, /home/user/submission/run.sh. The grader drives it step by step
# (closed_loop: robotics_grader.Solver and the probe lock) through a fixed hidden set of 12 procedures, 800 control
# steps each, and gives it at every step only the endoscope's RGB frame (one step old, drawn by Isaac Sim's RTX
# renderer in the grader's own process tree) and the holder's four joint readings: never instrument poses, never the
# procedure's phase, never which scope (0 or 30 degrees) is fitted. Score: useful_view_fraction, the fraction of
# control steps whose view is usable (both counting tips in the central safe zone, the instruments' apparent size in
# the zoom band, the horizon level, the picture steady during fine work, the lens clean), judged from the simulator's
# state, never from pixels. The agent gets what the device's engineer would have: the holder's manual and kinematic
# model, the scopes' intrinsics, ten development procedures as labelled video, and a commissioning service that plays
# those development procedures for its controller without ground truth or score (12 sessions). Design notes, what is
# verified and what is not: tests/README.md. Needs one NVIDIA RTX GPU.

schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/endoscope_camera_assistance_from_video"

[metadata]
platform = "surgical"

# gpu_types: the cloud models on which the benchmark has validated this same Isaac Sim 6.2 RTX stack
# (tasks/swarm/hazard_bay_build), cheapest first. THIS TASK HAS NOT RUN ON ANY OF THEM YET: it was developed and
# measured natively on an RTX 6000 Ada (not a cloud-listed model), without Docker. The list is the conservative
# starting point for the first `ale validate`: it keeps the task off the H100 and H200, where RTX rendering of this
# stack is unproven (hazard_bay_build's missions did not run on a loaded H100 host; other Isaac tasks crash or render
# darker there). A maintainer confirms or corrects the list with the render canary and a validate per model
# (tests/README.md, status log).
[environment]
cpus = 8
memory_mb = 32768
gpus = 1
gpu_types = ["RTX-4090", "RTX-5090", "RTX-PRO-6000"]

# Setup (environment/setup/setup.sh) has no field: the engine bounds it at a fixed 1800 s. It stages the givens and
# starts the commissioning service, waiting for its renderer (Isaac Sim's start; on a cold cache the RTX pipelines
# compile, measured for this stack by hazard_bay_build at about 7 minutes in a fresh container; 20 s here, warm).
# [agent] timeout_sec: 4 h. The development set records in the background during the first minutes (ten procedures,
# 401 frames each: 7 min 15 s here); a commissioning session takes 1 to 3 minutes of wall clock.
# [verifier] timeout_sec: the renderer's start (cold, up to renderer_start_timeout_s = 2400 s), the canary (seconds),
# then 12 procedures x 800 steps: each step one frame (0.07 to 0.09 s here on a shared machine, measured:
# tests/README.md) plus the controller's reply, whose total is capped at 2400 s (0.25 s a step), plus the scenes'
# loading (about 7 s each): 2400 + 9600 x 0.09 + 2400 + 12 x 7 = about 5750 s at the bounds; the reference's whole
# verify took 13 to 15 minutes here on a warm cache. 9000 s leaves room for a host that renders at half this speed.
[agent]
timeout_sec = 14400
network_mode = "no-network"

[verifier]
timeout_sec = 9000
# Separate verification: a fresh verifier sandbox from the same image, which the agent never touched; only the
# declared artifact (/home/user/submission) is restored into it. In a shared sandbox, a program the agent left on
# root's PATH (the base image's /usr/local/bin is the agent's) would run as root at verify.
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 32768
gpus = 1
gpu_types = ["RTX-4090", "RTX-5090", "RTX-PRO-6000"]
