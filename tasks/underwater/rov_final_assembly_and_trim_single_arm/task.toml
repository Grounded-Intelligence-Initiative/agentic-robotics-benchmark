# rov_final_assembly_and_trim_single_arm (assembly stage: the propulsion, electronics and trim station of a small-batch
# assembly line for an inspection-class ROV. A UR10e-class arm with a wide-stroke parallel gripper finishes a vehicle
# that a two-position turnover positioner holds over three load cells: ballast weights screwed under the keel plate
# while the keel is up, then, deck up, the electronics enclosure, four vertical thrusters of two propeller hands and two
# thruster guards; seven structural places of total weight 11.0 plus the trim of the finished vehicle, weight 4.5).
#
# The agent receives the units as delivered (six STL files, the packing list), seven drawings, the trim sheet, the
# water density chart and the propeller datasheet (pictures), the station scope and a work-order example, the
# 16-photo picture manual with physical scale references, the cell's manual, API and public configuration, the robot
# models and the cell library; no practice, no checker. It delivers assemble.py (solve(cell)), run as an unprivileged
# account under netguard on the 4 pre-registered fixed hidden episodes of the grader's MuJoCo cell
# (tests/arm/assembly_rov). Per episode: a work order naming the delivery water (temperature and salinity), a base
# vehicle off the trim sheet's tabled mass and centre of mass by a per-unit deviation that only the load cells reveal,
# the thruster tray, the enclosure rack and the two guard racks placed and turned around their nominal places, the
# thrusters' arrangement and propeller angles and the enclosure's roll and dome end drawn; two uncalibrated RGB-D
# cameras, top and wrist, rendered by MuJoCo's Filament on CPU Vulkan in the baked workshop; noisy F/T and load
# cells; no unit poses, no fastening events, no feedback on the trim. Score = the contract gate x the episode mean of
# (the counted structural weight + 4.5 x trim) / 15.5, an episode zeroed by a hard safety violation; trim is the
# functional acceptance: net buoyancy, pitch and roll of the finished vehicle in the work order's water, computed from
# the trim table, this vehicle's deviation and the ballast holes that actually lock. The oracle submits the privileged
# reference program with a 256-bit token on the same 4 hidden episodes. Grader knobs live in tests/grader_config.json;
# the cell's hidden kit (tests/gt/: the units' meshes and collision pieces) is not in the repository: the grader
# unpacks it at verify start from the benchmark's asset dataset (pinned by sha256), or from the local development copy
# tests/assets/gt.tar.xz when that is present. The grader and the fixed set: tests/README.md; sources and
# attributions: tests/NOTICE.md.
#
# DUAL MODE (experimental, 2026-11-24; never merged into main): one session, one verify, two scoring items, reward =
# their mean, each normalised by its own anchor (tests/anchor_offline.json = main's anchor.json,
# tests/anchor_online.json; the combined dual_mode_score in tests/anchor.json is 1.0 by construction).
# * The offline item is main's grading above, unchanged (tests/offline_verify.py = main's tests/verify.py byte for byte,
#   run by tests/verify.py in a root-only copy of tests/ laid out as main's), of the program FROZEN at the earlier of the
#   graded start and the start window's close (prep_s after the service's start): then (before a start is charged) the
#   graded episode's service has its root supervisor copy /home/user/submission into
#   /var/lib/arb-online/submission_snapshot (regular files and directories, no link followed, main's 60 MB cap), so the
#   program keeps main's preparation time; the submission at the session's end is graded only when the session ends
#   before the window closes, without a start, or there is no usable record.
# * The online item is the graded episode the agent plays itself during its session, through the graded episode's cell
#   service (environment/setup/online/service.py, started by environment/setup/setup.sh; the cell a byte copy of the
#   cell's part of tests/, its hidden kit fetched at setup as the verifier fetches it, served as the dedicated `arbcell`
#   account over a unix socket; the client ~/given/lib/arm/assembly_rov/graded.py, connect_graded()): episode E3 of the
#   fixed hidden set (drawn once with OS entropy, tests/online.json), the same rules and score as an offline episode; it
#   can be started once, within prep_s = 21600 s (main's agent budget, shared by the program and the preparation) of the
#   service's start, and ends at the agent's finish, at the cell's own end, graded_s = 10800 s after its start, or when
#   the session ends (the last record applies). Its record goes to /var/lib/arb-online, which the agent can neither read
#   nor write.
# There is no practice facility. The oracle (solution/solve.sh) leaves main's reference program in the submission, then
# starts the graded episode with the oracle token and runs the privileged reference program through the client.

schema_version = "1.4+ale.1"
# Where the agent leaves its work (assemble.py and its helpers), and the graded episode's record directory (record.json,
# requests.jsonl, the program frozen at the start in submission_snapshot/, the replay record trace/), written by the
# service as its own account and by its root supervisor; the engine collects both as root after the agent phase.
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/rov_final_assembly_and_trim_single_arm"

[metadata]
platform = "underwater"
direction = "assembly"
metric = {name = "assembly_score", direction = "higher", hardware_invariant = true}
mode = "atomic"
stage = "assembly"
stage_key = "assembly"
info_tier = 1
hidden_instance = "fixed-set"
practice_instances = []
render_backend = "filament"
photo_set_version = "1"
given_from = {stage = "hardware-design", adapter = "rov-kit"}
entry = "design-first"
route = "code-as-policy"
agent_role = ["assembly engineer", "assembly-cell programmer"]
artifact_kind = ["program"]
oracle_kind = "token-privileged"
compute = "cpu"
branch = {assembler = "ur10e-class arm + wide-stroke parallel gripper", fastening = "coupling (keyed capture behind a rest gate, pull home, lock at rest); ballast weights fastened at their keel holes", joints = "none moving (a two-position turnover positioner on three load cells)", engine = "mujoco", observation = "cameras + load cells + work order"}
observation_tier = "camera+force"
randomisation = ["work order: delivery water temperature and salinity, one stratum per episode", "base vehicle: mass +-0.25 kg, centre of mass x -7..+1 mm, y -4..+8 mm off the tabled values", "thruster tray +-40 mm, +-10 deg; the 2 + 2 thrusters' arrangement in its 4 pockets and their propeller angles", "enclosure rack +-20 mm, +-5 deg; enclosure roll +-20 deg, dome end 0 / 180 deg", "guard racks +-20 mm, +-5 deg each", "cameras (mount, intrinsics, distortion)", "lighting", "F/T bias", "load-cell zero offsets"]
# expert_time_hours: an ESTIMATE (not measured), set beside the sibling assembly tasks (60 and 80): calibrating the two
# cameras, finding and grasping 7 structural units of 4 kinds and 12 ballast blocks, weighing the vehicle and working out
# its ballast from the trim sheet and the work order's water, the turnover, and a program that does all of it unseen.
expert_time_hours = 80
siblings = ["quadruped_full_assembly_12dof_ur10e", "racecar_full_assembly_tenth_scale_ur10e"]
tags = ["assembly", "mujoco", "ur10e", "code-as-policy", "rgbd", "load-cells", "trim", "buoyancy", "work-order", "picture-manual", "underwater", "rov", "oracle-token"]

# The agent's sandbox: 8 CPUs, 24 GB (an assembly program, its own simulation twin and the CPU renderer share it).
[environment]
cpus = 8
memory_mb = 24576
gpus = 0

# [agent] timeout_sec (dual mode): prep_s + graded_s = 21600 + 10800 = 32400 s: main's 6 h for the program and the
# preparation (the start window, counted from the graded episode's service's start), then 3 h for the graded episode
# (the online variant's graded window; the reference program's episode takes about 4 min of wall clock).
# [verifier] timeout_sec: an agent's program runs 4 x (cell build + program <= the wall cap of 2400 s) inside the
# verifier. Measured in the real sandbox (8 CPUs, 24 GB, separate verifier; host load 68-114): the sandbox's provision
# and setup 4.2 s, the verify stage outside the episodes 7.5 s, a cell build <= 1.23 s, the overshoot past the wall cap
# <= 20.6 s (the longest single call 19.3 s), the episode trace's save 4.6 s per episode: worst 9717 s, 78 min below
# 14400 s (the design asks >= 60 min). The oracle's verify (4 x the reference program, 216-301 s simulated) took about
# 690 s of wall clock. The kit's download (not measurable while the asset is unpublished) is bounded by its retries.
# Dual mode: the verify stage runs main's grading again (its time above) and reads the graded episode's record (seconds).
# The agent's sandbox (below) also holds the graded episode's service: about 0.9 GB while it waits, about 5-6 GB once the
# cameras are used (the cell and its Filament camera session).
[agent]
timeout_sec = 32400
network_mode = "no-network"

# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifacts (the submission and the graded episode's record directory, both written
# root-owned by the engine) restored into it, so nothing else the agent left (a file, a process, a program planted on
# root's PATH) reaches it. environment/setup/setup.sh does not run there: tests/test.sh
# builds the grader's root-owned copy of the givens itself, and the grader fetches the cell's hidden kit (verification
# has network). The agent's program runs during verify (beside the cell and the Filament renderer), so the verifier
# gets at least the agent's resources (CPU rendering: no GPU).
[verifier]
timeout_sec = 14400
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 24576
gpus = 0
