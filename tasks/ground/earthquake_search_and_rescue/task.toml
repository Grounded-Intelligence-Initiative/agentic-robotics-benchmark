# earthquake_search_and_rescue (search and rescue in a collapsed building, ground robot; built 2026-11-12 by Yuanfang
# Peng; tests/README.md).
#
# An SR-2 rescue crawler (tracks on telescopic cross beams: gauge 0.30-0.50 m, front and rear flippers, a telescopic
# sensor mast with an RGB-D camera, a radiometric thermal camera, a 16-channel lidar and lamps, a five-axis arm with a
# parallel gripper, a survival kit on its deck; MuJoCo, CPU) is set down on the street in front of a building an
# earthquake brought down. Every hidden episode is a different site: the building's bays, which of them still stand,
# pancaked into crawl voids or filled with rubble, the openings between them and what blocks them (a timber beam across
# a doorway to lift out, a narrow slot that needs the narrow gauge, a broken slab wedged in a doorway to climb with the
# flipper technique, a strip of floor dropped into the basement to bridge, crawl spaces under dropped slabs, dead ends,
# load-bearing props that must not be touched), the survivor's pocket and the decoys (a shop mannequin, a warm boiler).
# The radio link drops inside the rubble, so the agent writes the robot's AUTONOMOUS program: it searches with the
# robot's own sensors and odometry only, clears what can be moved, finds the survivor, reports their position in the
# robot's map frame (it reaches the team over the link), puts the kit within their reach and brings the robot back.
# Score = the mean over the hidden sites of located 0.45 + kit 0.25 + returned 0.30; a secondary collapse (a prop that
# really carries its slab, pushed or pulled out) scores a site 0; contact with the survivor above 60 N trips the
# robot's protective stop, which ends the mission without the return and caps it at 0.45. The hidden set is fixed:
# eight sites pinned in tests/hidden/seeds.json, selected by the pre-registered rule of tests/hidden/selection.json
# (rule version 2: candidates from OS entropy, admitted when the reference program completes them). The oracle submits the reference program with a 256-bit token: it reads the site's plan (the
# route, the obstacles, the survivor) and drives with the true pose, which the agent never gets.
# Realism rule: the agent gets what a robotics engineer of a response team would have: the robot's manual and API, the
# team's field guide, the client library, the grader's submission checks, and the team's training ground (a black-box
# commissioning service under its own account: the test lanes and six training rubble sites, the robot's own mission
# log after each exercise, no truth of the site, no score, no debrief); the simulator's code, the site plans and every
# ground truth stay out of its reach.
#
# DUAL MODE (experimental, 2026-11-24; never merged into main): one session, one verify, two scoring items, reward =
# their mean, each normalised by its own anchor (tests/anchor_offline.json = main's, tests/anchor_online.json; the
# combined dual_mode_score in tests/anchor.json is 1.0 by construction).
# * The offline item is main's grading above, unchanged (tests/offline_verify.py: main's verify.py with two hooks), of
#   the program FROZEN at the earlier of the graded start and the start window's close (prep_s after the service's
#   start): then (before a start is charged) the graded episode's service has its root supervisor copy
#   /home/user/submission into /var/lib/arb-online/submission_snapshot (the agent's regular files and folders, no link
#   followed, main's 60 MB cap), so the program keeps main's preparation time; the submission at the session's end is
#   graded only when the session ends before the window closes, without a start.
# * The online item is the graded episode the agent drives itself during its session, through the graded episode's
#   service (environment/setup/online/graded_service.py, started by environment/setup/setup.sh; the grader's cell, the
#   image's byte copy of tests/rubblecell, served as the dedicated `rubblegrade` account over a unix socket; the client
#   ~/given/lib/rubblecell's connect_graded()): site ep04 of the fixed hidden set (drawn once with OS entropy,
#   tests/online.json), the same robot, physics, budgets, safety rules and score as an offline mission; it can be
#   started once, within prep_s = 14400 s (main's agent budget, shared by the program and the preparation) of the
#   service's start, and ends at the agent's finish, at the cell's own end, graded_s = 10800 s after its start, or when
#   the session ends (the last record applies). Its record goes to /var/lib/arb-online, which the agent can neither read
#   nor write. The simulation advances only inside the agent's step requests: between requests nothing moves.
# * Practice ends at the graded start (O13): the start writes /run/rubblecell-graded/flags/started and the training
#   ground ends its open missions and refuses new ones (environment/training_ground/trainingd.py).
# The oracle (solution/solve.sh) leaves main's reference program in the submission, then starts the graded episode with
# the oracle token and runs the privileged reference program through the client.

schema_version = "1.4+ale.1"
# Where the agent leaves its work (rescue.py and its helper modules), and the graded episode's record directory
# (record.json, state.json, requests.jsonl, traj.npz, the program frozen at the start in submission_snapshot/), written
# by the service as its own account and by its root supervisor; the engine collects both as root after the agent phase.
artifacts = ["/home/user/submission", "/var/lib/arb-online"]

[task]
name = "grounded-intelligence-initiative/earthquake_search_and_rescue"

[metadata]
# One of the benchmark's platform keys (tasks/platforms.json); the folder lives at tasks/ground/<name>/. The metric
# (rescue_score, higher) lives in tests/anchor.json.
platform = "ground"
tags = ["search-and-rescue", "earthquake", "rubble", "tracked-robot", "flippers", "reconfigurable", "mobile-manipulation",
        "exploration", "lidar", "thermal-camera", "rgbd", "mujoco", "code-as-policy", "hidden-seed", "oracle-token"]

[environment]
cpus = 8
memory_mb = 16384

# setup (no field: the engine bounds it at a fixed 1800 s): the givens in the agent home, the graded episode's service
# (its site and look built as root: about 40-50 s on 8 CPUs) and the training ground.
# [agent] timeout_sec (dual mode): prep_s + graded_s = 14400 + 10800 = 25200 s: main's 4 h for the program and the
# preparation (the start window, counted from the service's start), then 3 h for the graded episode (the oracle's
# episode takes about 7 min of wall clock). [verifier] timeout_sec: main's, since main's offline grading runs again
# (reading the graded episode's record takes seconds): the import check (at most 120 s), the desktop settle (at most 60
# s), then 8 hidden sites, each a site build with its look (the render and sensor twins, the sky: about 15 s on 8 CPUs;
# the first colour frame's shaders and textures: about 15 s more) plus the program within its 1200 s program-time cap,
# which does not count the cell's simulation (1800 s simulated at most, at 2-5x real time here: up to about 15 min of
# wall clock) and sensor rendering (700 camera frames at 0.5-0.9 s: Filament colour on lavapipe, classic depth, the
# encoding; 1800 lidar sweeps at about 0.2 s, 1800 thermal frames at 0.05 s: up to about 20 min, measured on 8 CPUs),
# plus the end and clean-up: at the bounds about 4000 s a site, 32000 s for the eight, 36000 s with one site run twice
# after a cell failure (a request cannot cause one: the cell refuses non-finite and malformed parameters); 11 h leaves
# 10 % of margin on that bound. A program that uses its whole program time, simulated time and every sensor budget on
# every site is far from any run seen; the oracle's sites run the reference program inside one privileged call (about
# 3-6 min each here).
[agent]
timeout_sec = 25200
network_mode = "no-network"

[verifier]
timeout_sec = 39600
# Separate verification: the grader runs as root in a fresh verifier sandbox from the task image that the agent never
# touched, with only the declared artifacts (the submission and the graded episode's record directory) restored into
# it, so nothing else the agent left reaches it. environment/setup/setup.sh does not run there:
# tests/test.sh builds the grader's root-owned copy of the givens itself. The agent's program runs during verify, so
# the verifier gets the agent's resources (CPU rendering: no GPU).
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 16384
gpus = 0
