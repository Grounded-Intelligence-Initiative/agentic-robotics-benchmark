# drone_hover — develop a hovering policy for a Crazyflie in gym-pybullet-drones'
# HoverAviary (closed_loop).
#
# ALE-shaped port of the original drone_hover task (M1 alignment spike). The eval
# protocol lives entirely in verify/: the grader owns the simulator, spawns the
# agent-built solver AS THE UNPRIVILEGED AGENT USER (runuser), and drives obs->action
# over a stdio JSON-lines wire with hidden perturbation probes and a per-step timeout.
# Anti-cheat: verify/ (grader + anchor) is absent from the sandbox during the agent
# phase and root-only during verify; the solver process runs as `user` and cannot read
# the grader's memory, env, or /opt/ale (iron law #1's "different container OR UID").

spec_type: core/v1
name: drone_hover
image: {kind: container}
resources: {cpus: 4, memory_mb: 8192}
network: {mode: block}

# agent: the dev/training budget (oracle trains PPO here too). verify: the full
# closed-loop scoring run (10 episodes x ~240 steps + probes).
timeouts: {setup: 120, agent: 10800, verify: 1800}

artifacts: [/home/user/submission]

# Grader knobs live in verify/grader_config.json (stage-local), NOT in params: params render
# into the instruction and the template check is strict both ways (an unused declared
# parameter is an error), and these values are the grader's business, not the prompt's.

# There is no admission bar here. `ale validate` fails the run unless an untouched sandbox
# produces an all-zero verdict; a non-1.0 oracle is only a `partial_oracle` WARNING to the
# engine, and the exact all-one oracle is ALE Robotics domain policy enforced by
# harness/ale_onboard.py. The seed-variance tolerance that lets a genuinely trained policy
# land on exactly 1.0 is `full_at` in verify/anchor.json.

metadata:
  platform: uav
  direction: control
  metric:
    name: mean_episode_reward
    direction: higher
    hardware_invariant: true
