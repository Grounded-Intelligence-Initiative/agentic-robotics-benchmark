spec_type: core/v1

name: fault_adaptive_spacecraft_docking

image: {kind: container}

resources: {cpus: 2, memory_mb: 4096}
network: {mode: block}
timeouts: {setup: 120, agent: 10800, verify: 1800}
artifacts: [/home/user/submission]

metadata:
  platform: spacecraft
  direction: control
  metric:
    name: mean_docking_quality
    direction: higher
    hardware_invariant: true
